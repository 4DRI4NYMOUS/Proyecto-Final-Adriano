<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo html-css</title>
    <link rel="icon" href="https://static.vecteezy.com/system/resources/previews/011/461/622/non_2x/simple-neon-blue-light-bulb-outline-on-black-background-illustration-vector.jpg">
    <style id="live-css">
        body {
            background-color: black;
            /* color del fondo */
            color: cyan;
            /* color del texto */
            font-family: Arial, sans-serif;
            /* tipo de letra */
            font-size: 20px;
            /* tamaño de letra */
            text-align: center;
            /* alineación del texto */

            margin: 0;
            /* espacio exterior */
            padding: 30px;
            /* espacio interior */
        }

        h1 {
            color: cyan;
            /* color del título */
            font-size: 40px;
            /* tamaño del título */
            font-weight: bold;
            /* grosor de la letra */
            text-shadow: 0 0 10px cyan;
            /* sombra del texto */
        }

        p {
            font-size: 20px;
            /* tamaño del texto */
            line-height: 1.5;
            /* separación entre líneas */
            letter-spacing: 1px;
            /* separación entre letras */
        }

        .caja {
            width: 300px;
            /* ancho */
            height: 150px;
            /* alto */

            background-color: darkblue;
            /* color de fondo */
            color: white;
            /* color del texto */

            border: 3px solid cyan;
            /* borde */
            border-radius: 20px;
            /* redondeo de esquinas */

            margin: 30px auto;
            /* espacio exterior */
            padding: 20px;
            /* espacio interior */

            box-shadow: 0 0 20px cyan;
            /* sombra de la caja */

            display: flex;
            /* activa Flexbox */
            justify-content: center;
            /* centra horizontalmente */
            align-items: center;
            /* centra verticalmente */

            transition: 0.3s;
            /* duración de las transiciones */
        }

        button {
            background-color: cyan;
            /* color del botón */
            color: black;
            /* color del texto */

            font-size: 18px;
            /* tamaño del texto */
            font-weight: bold;
            /* grosor del texto */

            border: none;
            /* elimina el borde */
            border-radius: 10px;
            /* redondea las esquinas */

            padding: 12px 25px;
            /* espacio interior */

            cursor: pointer;
            /* cambia el cursor */
            transition: 0.3s;
            /* duración de la transición */
        }

        button:hover {
            transform: scale(1.1);
            /* aumenta el tamaño */
            box-shadow: 0 0 15px cyan;
            /* agrega sombra */
        }
    </style>
</head>

<body>
    <h1>Ejemplo HTML-CSS</h1>
    <p>
        Modifica los valores del CSS y observa qué sucede.
    </p>
    <div class="caja">
        Caja de prueba.
    </div>
    <button>
        Botón de prueba
    </button>
    <h2>Editor CSS</h2>
    <textarea id="editor" spellcheck="false">body {
    background-color: black;        /* color del fondo */
    color: cyan;                    /* color del texto */
    font-family: Arial, sans-serif; /* tipo de letra */
    font-size: 20px;                /* tamaño de letra */
    text-align: center;             /* alineación del texto */

    margin: 0;                      /* espacio exterior */
    padding: 30px;                  /* espacio interior */
}

h1 {
    color: cyan;                    /* color del título */
    font-size: 40px;                /* tamaño del título */
    font-weight: bold;              /* grosor de la letra */
    text-shadow: 0 0 10px cyan;     /* sombra del texto */
}

p {
    font-size: 20px;                /* tamaño del texto */
    line-height: 1.5;               /* separación entre líneas */
    letter-spacing: 1px;            /* separación entre letras */
}

.caja {
    width: 300px;                   /* ancho */
    height: 150px;                  /* alto */

    background-color: darkblue;     /* color de fondo */
    color: white;                   /* color del texto */

    border: 3px solid cyan;         /* borde */
    border-radius: 20px;            /* redondeo de esquinas */

    margin: 30px auto;              /* espacio exterior */
    padding: 20px;                  /* espacio interior */

    box-shadow: 0 0 20px cyan;      /* sombra de la caja */

    display: flex;                  /* activa Flexbox */
    justify-content: center;        /* centra horizontalmente */
    align-items: center;            /* centra verticalmente */

    transition: 0.3s;               /* duración de las transiciones */
}

button {
    background-color: cyan;         /* color del botón */
    color: black;                   /* color del texto */

    font-size: 18px;                /* tamaño del texto */
    font-weight: bold;              /* grosor del texto */

    border: none;                   /* elimina el borde */
    border-radius: 10px;            /* redondea las esquinas */

    padding: 12px 25px;             /* espacio interior */

    cursor: pointer;                /* cambia el cursor */
    transition: 0.3s;               /* duración de la transición */
}

button:hover {
    transform: scale(1.1);          /* aumenta el tamaño */
    box-shadow: 0 0 15px cyan;      /* agrega sombra */
}</textarea>
    <script>

        const editor = document.getElementById("editor");
        const liveCSS = document.getElementById("live-css");

        editor.addEventListener("input", function () {
            liveCSS.textContent = editor.value;
        });

    </script>
</body>

</html>
